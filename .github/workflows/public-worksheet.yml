name: Verify public worksheet and record demo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  worksheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: public-worksheet
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public-worksheet/package-lock.json
      - run: npm ci --no-fund
      - run: npm run release:check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run browser:check
      - name: Record the working application
        run: npm run demo:record
      - name: Build captioned MP4
        run: python3 scripts/package-demo.py
      - name: Retain actual results and footage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meu-public-worksheet-evidence
          path: |
            public-worksheet/test-results/
            public-worksheet/demo-output/
          retention-days: 30
          if-no-files-found: error
